
name: Run Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-dotnet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore dotnet-app/ProjectFile.csproj
          dotnet restore dotnet-app.Tests/ProjectFile-Tests.csproj

      - name: Build application
        run: dotnet build dotnet-app/ProjectFile.csproj --no-restore

      - name: Run .NET tests
        run: dotnet test dotnet-app.Tests/ProjectFile-Tests.csproj --logger "trx;LogFileName=TestResults.trx" --results-directory TestResults

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-report
          path: TestResults/TestResults.trx

  test-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install unittest-xml-reporting

      - name: Run Python Tests and Generate XML Report
        run: |
          cd python-app
          python test_math_utils.py

      - name: Upload Python Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-report
          path: python-app/test-reports/
